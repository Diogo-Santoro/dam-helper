name: 🚀 CI - Validar Build y Apuntes

# Se ejecuta cada vez que alguien abre o actualiza un Pull Request hacia la rama main,
# o cuando se hace push directo a main.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Si un compañero hace varios commits seguidos en el mismo PR,
# se cancelan las ejecuciones anteriores para ahorrar tiempo y recursos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validaciones y Compilación
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar entorno de Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci --ignore-scripts

      - name: 🌿 Validar nombre de la rama (Reglas de CONTRIBUTING)
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          REGEX="^(apuntes|test|fix|feat|docs|chore|refactor)\/[a-z0-9._-]+$"
          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "::error::❌ El nombre de la rama '$BRANCH_NAME' no cumple con las reglas de CONTRIBUTING.md."
            echo "Formatos válidos: apuntes/*, test/*, fix/*, feat/*, docs/*, chore/*, refactor/*"
            exit 1
          fi
          echo "✅ Rama válida: $BRANCH_NAME"

      - name: 📝 Validar mensajes de commits (Commitlint)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          npm run commitlint -- --from "origin/$BASE_REF" --to HEAD --verbose

      - name: 🔍 Ejecutar Linter (ESLint)
        run: npm run lint

      - name: 🎨 Validar formato de código (Prettier)
        run: npm run format:check

      - name: 🧪 Verificar tipos de TypeScript
        run: npm run typecheck

      - name: 🏗️ Compilar el proyecto (Build de la web)
        run: npm run build

      - name: ⚡ Cache SonarQube packages
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 🔍 SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=diogo-santoro-1
            -Dsonar.projectKey=Diogo-Santoro_dam-helper
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
